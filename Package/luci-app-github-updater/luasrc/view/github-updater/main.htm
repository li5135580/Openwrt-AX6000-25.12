<%+header%>
<style>
<%# 主题自适应：不用写死的底色/文字色，全部继承主题变量，深浅主题均可读 %>
.ghu-box{border:1px solid rgba(128,128,128,.35);border-radius:6px;padding:12px 16px;margin:12px 0;background:transparent;color:inherit}
.ghu-ok{color:#5cb85c;font-weight:bold}
.ghu-new{color:#f0ad4e;font-weight:bold}
.ghu-err{color:#d9534f;font-weight:bold}
.ghu-btn{display:inline-block;margin:6px 10px 6px 0;padding:7px 18px;border:1px solid rgba(128,128,128,.45);border-radius:6px;background:transparent;color:inherit;cursor:pointer;text-decoration:none}
.ghu-btn:hover{border-color:#4a89dc}
.ghu-btn[disabled]{opacity:.45;cursor:not-allowed}
.ghu-btn-danger{border-color:#d9534f;color:#d9534f}
.ghu-bar{height:18px;background:rgba(128,128,128,.25);border-radius:9px;overflow:hidden;margin-top:8px}
.ghu-bar-in{height:100%;width:0%;background:linear-gradient(90deg,#4a89dc,#5cb85c);transition:width .6s;text-align:center;font-size:11px;line-height:18px;color:#fff;white-space:nowrap}
@keyframes ghu-indet{0%{left:-40%}100%{left:100%}}
.ghu-bar-indet{position:relative;height:100%;width:40%;background:linear-gradient(90deg,#4a89dc,#5cb85c);animation:ghu-indet 1.1s infinite}
<%# 自绘开关：原生 checkbox 在 Argon/Design 桌面端会被主题样式覆盖导致无法点击，改用按钮式开关彻底规避 %>
.ghu-toggle{user-select:none}
.ghu-toggle[data-on="1"]{border-color:#5cb85c;color:#5cb85c;font-weight:bold}
.ghu-toggle[data-on="0"]{border-color:#d9534f;color:#d9534f}
#ghu-mirror{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.45);border-radius:4px;padding:6px}
#ghu-log{white-space:pre-wrap;background:#222;color:#ddd;padding:10px;border-radius:4px;font-family:monospace;font-size:12px;min-height:60px;max-height:280px;overflow:auto;margin-top:12px}
</style>

<h2><%:GitHub Releases 在线升级%></h2>
<p><%:检测固件仓库 Releases 中最新的自动编译固件，下载并校验后直接升级本机系统。%></p>

<div class="ghu-box">
	<div><%:当前固件%>：<b id="ghu-cur">…</b>（<span id="ghu-prof"></span>）</div>
	<div><%:最新发布%>：<b id="ghu-latest">…</b></div>
	<div id="ghu-state" style="margin-top:6px"></div>
</div>

<div class="ghu-box">
	<%:下载加速代理前缀%>（<%:国内可填，如%> https://ghfast.top/）：
	<input type="text" id="ghu-mirror" style="width:300px" placeholder="<%:留空为直连 GitHub%>">
	<a class="ghu-btn" href="javascript:savecfg()"><%:保存%></a>
</div>

<div class="ghu-box">
	<a class="ghu-btn" href="javascript:check()" id="ghu-b1"><%:检查更新%></a>
	<a class="ghu-btn" href="javascript:dl()" id="ghu-b2" disabled><%:下载并校验固件%></a>
	<a class="ghu-btn ghu-toggle" href="javascript:void(0)" id="ghu-keep" data-on="1"><%:保留配置升级：开%></a>
	<a class="ghu-btn ghu-btn-danger" href="javascript:up()" id="ghu-b3" disabled><%:开始升级%></a>
	<div id="ghu-dlbar" style="display:none">
		<div style="margin-top:8px;font-size:12px"><%:下载地址%>：<a id="ghu-dlurl" href="#" target="_blank" style="word-break:break-all"></a></div>
		<div class="ghu-bar"><div class="ghu-bar-in" id="ghu-bar-in">0%</div></div>
	</div>
	<div id="ghu-upbar" style="display:none">
		<div style="margin-top:8px;font-size:12px;color:#c02020"><b><%:正在升级，请勿断电或关闭页面，路由器将自动重启…%></b></div>
		<div class="ghu-bar"><div class="ghu-bar-indet"></div></div>
	</div>
</div>

<div id="ghu-log"></div>

<script>
var API = '<%=url("admin/system/github-updater")%>';
var TOKEN = '<%=token%>';

function log(m) {
	var el = document.getElementById('ghu-log');
	el.textContent += m + "\n";
	el.scrollTop = el.scrollHeight;
}
function api(act, extra, cb) {
	var x = new XMLHttpRequest();
	var called = false;
	function done(d) { if (!called) { called = true; cb(d); } }
	x.open('GET', API + '/' + act + '?token=' + TOKEN + (extra || ''), true);
	x.timeout = 120000;
	x.onreadystatechange = function() {
		if (x.readyState !== 4) return;
		var d = null;
		try { d = JSON.parse(x.responseText); } catch(e) {}
		if (!d) { done({ ok:false, error:'请求失败（HTTP ' + x.status + '）' }); return; }
		done(d);
	};
	x.ontimeout = function(){ done({ ok:false, error:'请求超时' }); };
	x.onerror = function(){ done({ ok:false, error:'网络错误' }); };
	x.send();
}
function fmtSize(b) {
	b = parseInt(b); if (!b) return '';
	return (b/1048576).toFixed(1) + ' MB';
}

// 保留配置开关：点击切换
document.getElementById('ghu-keep').addEventListener('click', function() {
	var on = this.getAttribute('data-on') === '1';
	this.setAttribute('data-on', on ? '0' : '1');
	this.textContent = on ? '保留配置升级：关' : '保留配置升级：开';
});

function check() {
	log('正在检查更新…');
	document.getElementById('ghu-state').textContent = '';
	api('check', '', function(d) {
		if (!d.ok) { log('× ' + (d.error || '检查失败')); return; }
		document.getElementById('ghu-cur').textContent = d.current || '未知';
		document.getElementById('ghu-prof').textContent = d.profile + ' 版 / ' + d.repo;
		document.getElementById('ghu-latest').textContent =
			(d.latest_date || '?') + '（' + (d.fw_name || '无固件文件') + (d.fw_size ? '，' + fmtSize(d.fw_size) : '') + '）';
		if (d.mirror) document.getElementById('ghu-mirror').value = d.mirror;
		log('√ 检测通道：' + (d.channel === 'atom' ? 'releases.atom（github.com 直连）' : 'GitHub API'));
		var st = document.getElementById('ghu-state');
		if (d.pending) {
			st.innerHTML = '<span class="ghu-new">● 新版本已下载待升级（' + d.pending + (d.pending_size ? '，' + fmtSize(d.pending_size) : '') + '）</span>';
			document.getElementById('ghu-b3').removeAttribute('disabled');
			log('√ 之前下载并校验通过的固件仍在，可直接点「开始升级」，无需重新下载');
		} else if (d.has_update) {
			st.innerHTML = '<span class="ghu-new">● 发现新版本，可以升级</span>';
			document.getElementById('ghu-b2').removeAttribute('disabled');
			log('√ 发现新版本：' + d.latest_date);
			if (d.changelog && d.changelog.length > 0) {
				log('');
				log('——— 本次更新内容 ———');
				log(d.changelog);
				log('————————————————————');
			}
		} else {
			st.innerHTML = '<span class="ghu-ok">● 已是最新版本</span>';
			document.getElementById('ghu-b2').removeAttribute('disabled');
			log('√ 当前已是最新（如需强制重装可直接下载升级）');
		}
		if (d.page) log('完整更新说明：' + d.page);
		if (d.fw_url) log('固件地址：' + d.fw_url);
	});
}

function dl() {
	document.getElementById('ghu-b2').setAttribute('disabled', '1');
	log('正在启动下载…');
	api('download', '', function(d) {
		if (!d.ok) {
			log('× ' + d.error);
			document.getElementById('ghu-b2').removeAttribute('disabled');
			return;
		}
		var urlEl = document.getElementById('ghu-dlurl');
		urlEl.textContent = d.url || '';
		urlEl.href = d.url || '#';
		document.getElementById('ghu-dlbar').style.display = 'block';
		log(d.resumed ? '√ 从断点续传' : '√ 下载已开始（共 ' + (d.sources || 1) + ' 个下载源，失败自动切换）');
		if (d.already) log('△ 已有下载任务在进行中');
		poll();
	});
}

var polling = false;
function poll() {
	if (polling) return;
	polling = true;
	var lastSize = -1, stall = 0, hinted = false, errCount = 0;
	// 递归 setTimeout：上一次请求完成后再发起下一次，避免 XHR 重叠乱序
	function step() {
		api('progress', '', function(d) {
			// 进度查询连续失败 5 次则中止并显示每次的错误详情
			if (!d || d.ok === undefined || (d.ok === false && !d.done)) {
				errCount++;
				log('× 进度查询失败（' + errCount + '/5）：' + ((d && d.error) || '未知错误'));
				if (errCount >= 5) {
					polling = false;
					log('× 进度查询连续失败，已停止（请刷新页面重试）');
					document.getElementById('ghu-b2').removeAttribute('disabled');
					return;
				}
				setTimeout(step, 1000);
				return;
			}
			errCount = 0;
			if (!d.ok && d.done) {
				polling = false;
				log('× ' + d.error);
				document.getElementById('ghu-b2').removeAttribute('disabled');
				return;
			}
			if (!d.done) {
				var pct = d.total ? Math.min(99, Math.floor(d.size * 100 / d.total)) : 0;
				var bar = document.getElementById('ghu-bar-in');
				bar.style.width = pct + '%';
				bar.textContent = fmtSize(d.size) + (d.total ? ' / ' + fmtSize(d.total) + '（' + pct + '%）' : '');
				// 停滞检测：12 秒无进展则提示会自动换源
				if (d.size === lastSize) { stall++; } else { stall = 0; lastSize = d.size; }
				if (stall >= 12 && !hinted) {
					hinted = true;
					log('△ 当前源 12 秒无进展，会自动尝试下一个下载源（直连 → 加速代理），请稍候');
				}
				setTimeout(step, 1000);
				return;
			}
			polling = false;
			var bar = document.getElementById('ghu-bar-in');
			bar.style.width = '100%';
			bar.textContent = '100%';
			log('√ 下载完成（' + fmtSize(d.size) + '）');
			log(d.verified ? '√ SHA256 校验通过' : '△ 无校验信息，已跳过校验');
			document.getElementById('ghu-b3').removeAttribute('disabled');
		});
	}
	step();
}

function up() {
	var keep = document.getElementById('ghu-keep').getAttribute('data-on') === '1';
	if (!confirm('确认开始升级？\n' + (keep ? '将保留当前配置。' : '将不保留配置（恢复出厂）！') + '\n升级过程中请勿断电。')) return;
	document.getElementById('ghu-b3').setAttribute('disabled', '1');
	document.getElementById('ghu-b1').setAttribute('disabled', '1');
	document.getElementById('ghu-b2').setAttribute('disabled', '1');
	api('upgrade', '&keep=' + (keep ? '1' : '0'), function(d) {
		if (!d.ok) {
			log('× ' + d.error);
			document.getElementById('ghu-b3').removeAttribute('disabled');
			return;
		}
		// 升级即断连重启，无法回报真实进度，显示提示动画
		document.getElementById('ghu-dlbar').style.display = 'none';
		document.getElementById('ghu-upbar').style.display = 'block';
		log('√ ' + d.msg);
		log('页面失去响应属正常现象，请等待路由器重启完成后重新访问。');
	});
}

function savecfg() {
	var m = document.getElementById('ghu-mirror').value;
	api('savecfg', '&mirror=' + encodeURIComponent(m), function(d) {
		log(d.ok ? '√ 代理前缀已保存' : '× 保存失败');
	});
}

check();
</script>
<%+footer%>
