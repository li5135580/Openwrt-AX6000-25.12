#CI项目
name: MTK-ALL

#CI计划
on:
  #本仓库配置/插件变更时立即编译（push 事件不做跳过判断，永远直接编译）
  push:
    branches: [main]
  #每6小时检测一次上游更新（源码+插件均无变化时自动跳过编译）
  schedule:
    - cron: 17 */6 * * *
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#并发控制：同一时刻只跑一个构建，多余触发排队；
#排队等到执行时上游比对会发现刚编过，自动跳过，不会重复编译
concurrency:
  group: mtk-all
  cancel-in-progress: false

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [MT798X-WIFI-YES]
        PROFILE: [PURE, PLUS]
        SOURCE: [immortalwrt/immortalwrt]
        BRANCH: [openwrt-25.12]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      #WRT_THEME: aurora
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本：PURE=纯净版，PLUS=Plus 版
      WRT_PROFILE: ${{matrix.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
